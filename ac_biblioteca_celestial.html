    // --- CANVAS STARFIELD BACKGROUND ---
    (function initStars() {
      const canvas = document.getElementById('stars-canvas');
      const ctx = canvas.getContext('2d');
      let stars = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        createStars();
      }

      function createStars() {
        stars = [];
        const count = Math.floor((canvas.width * canvas.height) / 7000);
        for (let i = 0; i < count; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 1.8 + 0.2,
            alpha: Math.random() * 0.8 + 0.2,
            speed: Math.random() * 0.015 + 0.005
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(star => {
          star.alpha += Math.sin(Date.now() * star.speed) * 0.01;
          star.alpha = Math.max(0.1, Math.min(0.9, star.alpha));
          ctx.fillStyle = `rgba(242, 213, 142, ${star.alpha})`;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fill();
        });
        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      resize();
      draw();
    })();

    // --- AUDIO ATMOSPHERE GENERATOR (Web Audio API) ---
    const CosmicAudio = {
      ctx: null,
      osc1: null,
      gainNode: null,
      isPlaying: false,

      toggle() {
        if (this.isPlaying) {
          this.stop();
          return false;
        } else {
          this.start();
          return true;
        }
      },

      start() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();

          // Smooth ambient drone synthesizer
          this.osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          this.gainNode = this.ctx.createGain();

          this.osc1.type = 'sine';
          this.osc1.frequency.setValueAtTime(108, this.ctx.currentTime); // Deep calming frequency A2-ish

          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(216, this.ctx.currentTime);

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(400, this.ctx.currentTime);

          this.gainNode.gain.setValueAtTime(0.01, this.ctx.currentTime);
          this.gainNode.gain.exponentialRampToValueAtTime(0.15, this.ctx.currentTime + 3);

          this.osc1.connect(filter);
          osc2.connect(filter);
          filter.connect(this.gainNode);
          this.gainNode.connect(this.ctx.destination);

          this.osc1.start();
          osc2.start();
          this.isPlaying = true;
        } catch(e) {
          console.error('Audio not supported or blocked', e);
        }
      },

      stop() {
        if (this.gainNode && this.ctx) {
          this.gainNode.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1);
          setTimeout(() => {
            if (this.ctx) this.ctx.close();
            this.isPlaying = false;
          }, 1000);
        }
      }
    };

    // --- MAIN APPLICATION CONTROLLER ---
    class ACSoulApp {
      constructor() {
        this.currentPage = 'home';
        this.storeKey = 'ac_biblioteca_celestial_data_v1';
        this.data = this.loadStore();
        
        // Focus Timer State

          remaining: 25 * 60,
          interval: null,
          isRunning: false

        this.initDOM();
        this.render();

      loadStore() {
        const raw = localStorage.getItem(this.storeKey);
        if (!raw) {
          localStorage.setItem(this.storeKey, JSON.stringify(initialData));
          return JSON.parse(JSON.stringify(initialData));
        }
        try { return JSON.parse(raw); } catch(e) { return initialData; }
      }

      saveStore() {
        localStorage.setItem(this.storeKey, JSON.stringify(this.data));

        // Sidebar Navigation click listeners

            this.navigate(targetPage);

        // Mobile drawer menu toggle

          const sidebar = document.getElementById('sidebar');
          sidebar.classList.toggle('-translate-x-full');
        });

      navigate(pageId) {
        this.currentPage = pageId;

        // Active style navigation buttons

            <div class="flex flex-col sm:flex-row gap-4 items-center justify-between">
              <div class="flex gap-2 w-full sm:w-auto overflow-x-auto pb-2 sm:pb-0">
                <button id="btn-filter-all" onclick="app.filterBooks('all')" class="book-filter-btn px-4 py-2 rounded-xl text-xs font-medium bg-gold/20 text-goldLight border border-gold/30">Todos</button>
                <button id="btn-filter-reading" onclick="app.filterBooks('reading')" class="book-filter-btn px-4 py-2 rounded-xl text-xs font-medium text-cosmicMuted hover:text-goldLight border border-transparent">Lendo</button>
                <button id="btn-filter-want" onclick="app.filterBooks('want')" class="book-filter-btn px-4 py-2 rounded-xl text-xs font-medium text-cosmicMuted hover:text-goldLight border border-transparent">Quero Ler</button>
                <button id="btn-filter-read" onclick="app.filterBooks('read')" class="book-filter-btn px-4 py-2 rounded-xl text-xs font-medium text-cosmicMuted hover:text-goldLight border border-transparent">Concluídos</button>
              </div>
              <input type="text" placeholder="Buscar por título ou autor..." oninput="app.searchBooks(this.value)" class="w-full sm:w-64 bg-night border border-panelBorder rounded-xl px-4 py-2 text-xs text-cosmicText focus:border-gold outline-none">
            </div>

            <div id="booksGridContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              ${books.map(b => this.renderBookCardHTML(b)).join('')}
            </div>
          </div>
        `;
      }

      filterBooks(status) {
        document.querySelectorAll('.book-filter-btn').forEach(b => {
          b.classList.remove('bg-gold/20', 'text-goldLight', 'border-gold/30');
          b.classList.add('text-cosmicMuted', 'border-transparent');
        });
        const activeBtn = document.getElementById(`btn-filter-${status}`);
        if(activeBtn) activeBtn.classList.add('bg-gold/20', 'text-goldLight', 'border-gold/30');

        const books = this.data.books || [];
        const filtered = status === 'all' ? books : books.filter(b => b.status === status);
        document.getElementById('booksGridContainer').innerHTML = filtered.map(b => this.renderBookCardHTML(b)).join('');
      }

      searchBooks(query) {
        const q = query.toLowerCase();
        const books = this.data.books || [];
        const filtered = books.filter(b => b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q));
        document.getElementById('booksGridContainer').innerHTML = filtered.map(b => this.renderBookCardHTML(b)).join('');
      }

      renderBookCardHTML(book) {
        const progress = book.totalPages ? Math.min(100, Math.round((book.currentPage / book.totalPages) * 100)) : 0;
        const stars = '★'.repeat(book.rating || 0) + '☆'.repeat(5 - (book.rating || 0));
        const coverImg = book.cover || 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?auto=format&fit=crop&w=400&q=80';

        return `
          <div class="glass-card glass-card-hover rounded-2xl p-5 border-panelBorder flex gap-4 relative">
            <!-- Book Cover -->
            <div class="w-24 h-36 flex-shrink-0 rounded-lg overflow-hidden border border-panelBorder/60 bg-night shadow-md relative">
              <img src="${this.escapeHTML(coverImg)}" alt="${this.escapeHTML(book.title)}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/200x300/0d1325/d6ad5b?text=Sem+Capa'">
            </div>

            <!-- Details -->
            <div class="flex-1 flex flex-col justify-between min-w-0">
              <div>
                <div class="flex justify-between items-start gap-2">
                  <span class="text-[10px] uppercase font-semibold px-2 py-0.5 rounded-md bg-gold/10 text-gold border border-gold/20">${this.escapeHTML(book.category || 'Geral')}</span>
                  <div class="flex gap-1">
                    <button onclick="app.openBookModal('${book.id}')" class="text-cosmicMuted hover:text-gold text-xs">✏️</button>
                    <button onclick="app.deleteBook('${book.id}')" class="text-cosmicMuted hover:text-red-400 text-xs">🗑️</button>
                  </div>
                </div>

                <h4 class="font-playfair font-semibold text-base text-cosmicText truncate mt-1.5">${this.escapeHTML(book.title)}</h4>
                <p class="text-xs text-cosmicMuted truncate">${this.escapeHTML(book.author)}</p>
                <div class="text-xs text-goldLight mt-1">${stars}</div>
              </div>

              <!-- Reading Progress Bar -->
              <div class="space-y-1.5 mt-3">
                <div class="flex justify-between text-[11px] text-cosmicMuted">
                  <span>Pág: <strong class="text-goldLight">${book.currentPage}</strong> / ${book.totalPages}</span>
                  <span>${progress}%</span>
                </div>
                <div class="w-full h-1.5 bg-night rounded-full overflow-hidden border border-panelBorder/40">
                  <div class="h-full gold-gradient-bg transition-all duration-500 rounded-full" style="width: ${progress}%"></div>
                </div>

                <div class="pt-2 flex flex-wrap gap-2">
                  ${book.pdfUrl ? `
                    <button onclick="app.openPdfReader('${book.id}')" class="flex-1 py-1.5 rounded-lg text-xs font-semibold bg-gold/20 hover:bg-gold/30 text-goldLight border border-gold/40 transition-all flex items-center justify-center gap-1">
                      📖 Ler PDF
                    </button>
                  ` : ''}
                  <button onclick="app.updatePagesModal('${book.id}')" class="flex-1 py-1.5 rounded-lg text-xs font-semibold bg-gold/10 hover:bg-gold/20 text-goldLight border border-gold/30 transition-all">
                    + Atualizar Pág.
                  </button>
                </div>
              </div>

            </div>
          </div>
        `;
      }

      escapeHTML(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      deleteBook(bookId) {
        this.data.books = this.data.books.filter(b => b.id !== bookId);
        this.saveStore();
        this.render();
      }

      // --- INTENTIONS VIEW ---
      renderIntentionsView() {
        const intentions = this.data.intentions || [];
        return `
          <div class="space-y-6 max-w-4xl mx-auto">
            <div class="flex justify-between items-center">
              <div>
                <h3 class="font-cinzel text-xl font-semibold text-goldLight">◈ Intenções & Metas de Leitura</h3>
                <p class="text-xs text-cosmicMuted">Estabeleça propósitos para a sua jornada de conhecimento.</p>
              </div>
              <button onclick="app.openIntentionModal()" class="px-4 py-2 text-xs font-bold rounded-xl gold-gradient-bg text-night">+ Nova Meta</button>
            </div>

            <div class="space-y-4">
              ${intentions.map(item => {
                const pct = Math.min(100, Math.round((item.current / item.target) * 100));
                return `
                  <div class="glass-card rounded-xl p-6 border-panelBorder space-y-3">
                    <div class="flex justify-between items-center">
                      <h4 class="font-playfair text-lg text-cosmicText font-semibold">${this.escapeHTML(item.title)}</h4>
                      <div class="flex items-center gap-3">
                        <span class="text-xs text-gold font-bold">${item.current} / ${item.target} ${this.escapeHTML(item.unit)}</span>
                        <button onclick="app.incrementIntention('${item.id}')" class="px-3 py-1 bg-gold/20 text-goldLight rounded-lg text-xs hover:bg-gold/30">+ Log</button>
                      </div>
                    </div>
                    <div class="w-full h-2 bg-night rounded-full overflow-hidden border border-panelBorder">
                      <div class="h-full gold-gradient-bg transition-all duration-500" style="width: ${pct}%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      incrementIntention(id) {
        const item = this.data.intentions.find(i => i.id === id);
        if (item) {
          item.current += 1;
          this.saveStore();
          this.render();
        }
      }

      openIntentionModal() {
        const html = `
          <h3 class="font-cinzel text-xl font-semibold text-goldLight mb-4">Nova Meta de Leitura</h3>
          <form onsubmit="app.saveIntention(event)" class="space-y-4 text-xs">
            <div>
              <label class="block text-cosmicMuted mb-1 uppercase tracking-wider">Título da Meta</label>
              <input type="text" id="mIntTitle" required placeholder="ex: Ler 12 Livros em 2026" class="w-full bg-night border border-panelBorder rounded-xl p-3 text-cosmicText focus:border-gold">
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-cosmicMuted mb-1 uppercase tracking-wider">Objetivo (Alvo)</label>
                <input type="number" id="mIntTarget" required value="12" class="w-full bg-night border border-panelBorder rounded-xl p-3 text-cosmicText focus:border-gold">
              </div>
              <div>
                <label class="block text-cosmicMuted mb-1 uppercase tracking-wider">Unidade</label>
                <input type="text" id="mIntUnit" required value="livros" placeholder="livros, páginas, minutos" class="w-full bg-night border border-panelBorder rounded-xl p-3 text-cosmicText focus:border-gold">
              </div>
            </div>
            <button type="submit" class="w-full py-3 mt-2 rounded-xl gold-gradient-bg text-night font-bold uppercase tracking-wider">Criar Meta</button>
          </form>
        `;
        this.openModal(html);
      }

      saveIntention(e) {
        e.preventDefault();
        const newIntention = {
          id: String(Date.now()),
          title: document.getElementById('mIntTitle').value,
          target: Number(document.getElementById('mIntTarget').value),
          current: 0,
          unit: document.getElementById('mIntUnit').value
        };
        this.data.intentions.push(newIntention);
        this.saveStore();
        this.closeModal();
        this.render();
      }

      // --- JOURNAL VIEW ---
      renderJournalView() {
        const entries = this.data.journal || [];
        return `
          <div class="space-y-6 max-w-4xl mx-auto">
            <div class="flex justify-between items-center">
              <div>
                <h3 class="font-cinzel text-xl font-semibold text-goldLight">☽ Diário de Leitura & Reflexões</h3>
                <p class="text-xs text-cosmicMuted">Guarde passagens marcantes, citações e resumos.</p>
              </div>
              <button onclick="app.openJournalModal()" class="px-4 py-2 text-xs font-bold rounded-xl gold-gradient-bg text-night">+ Nova Nota</button>
            </div>

            <div class="space-y-4">
              ${entries.map(e => `
                <div class="glass-card rounded-2xl p-6 border-panelBorder space-y-3 relative group">
                  <div class="flex justify-between items-center text-xs">
                    <span class="font-semibold text-gold font-playfair text-base">${this.escapeHTML(e.bookTitle)}</span>

                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      deleteJournal(id) {
        this.data.journal = this.data.journal.filter(e => e.id !== id);
        this.saveStore();
        this.render();
      }

      openJournalModal() {
        const books = this.data.books || [];
        const options = books.map(b => `<option value="${this.escapeHTML(b.title)}">${this.escapeHTML(b.title)}</option>`).join('');

        const html = `
          <h3 class="font-cinzel text-xl font-semibold text-goldLight mb-4">Nova Reflexão no Diário</h3>
          <form onsubmit="app.saveJournal(event)" class="space-y-4 text-xs">
            <div>
              <label class="block text-cosmicMuted mb-1 uppercase tracking-wider">Livro</label>
              <select id="mJourBook" class="w-full bg-night border border-panelBorder rounded-xl p-3 text-cosmicText focus:border-gold">
                ${options}
              </select>
            </div>
            <div>
              <label class="block text-cosmicMuted mb-1 uppercase tracking-wider">Etiqueta / Tag</label>
              <input type="text" id="mJourTag" value="Citação Reflexiva" placeholder="Citação, Aprendizado, Resumo..." class="w-full bg-night border border-panelBorder rounded-xl p-3 text-cosmicText focus:border-gold">
            </div>
            <div>
              <label class="block text-cosmicMuted mb-1 uppercase tracking-wider">Conteúdo da Anotação</label>
              <textarea id="mJourContent" rows="4" required placeholder="Escreva aqui seu trecho preferido ou pensamento..." class="w-full bg-night border border-panelBorder rounded-xl p-3 text-cosmicText focus:border-gold"></textarea>
            </div>
            <button type="submit" class="w-full py-3 mt-2 rounded-xl gold-gradient-bg text-night font-bold uppercase tracking-wider">Salvar no Diário</button>
          </form>
        `;
        this.openModal(html);
      }

      saveJournal(e) {
        e.preventDefault();
        const newEntry = {
          id: String(Date.now()),
          bookTitle: document.getElementById('mJourBook').value,
          date: new Date().toISOString().split('T')[0],
          tag: document.getElementById('mJourTag').value || 'Anotação',
          content: document.getElementById('mJourContent').value
        };
        this.data.journal.unshift(newEntry);
        this.saveStore();
        this.closeModal();
        this.render();
      }

      // --- FOCUS TIMER VIEW ---
      renderFocusView() {
        const mins = Math.floor(this.timer.remaining / 60);
        const secs = this.timer.remaining % 60;
        const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

        return `
          <div class="max-w-xl mx-auto space-y-8 text-center animate-fade-in">
            <div class="space-y-2">
              <h3 class="font-cinzel text-2xl font-bold text-goldLight">◌ Foco na Leitura</h3>
              <p class="text-xs text-cosmicMuted">Sessão Pomodoro Celestial & Frequência Sonora</p>
            </div>

            <!-- Big Circular Timer Display -->
            <div class="glass-card rounded-full w-72 h-72 mx-auto flex flex-col items-center justify-center border-gold/40 shadow-2xl relative">
              <div class="text-5xl font-playfair font-bold text-goldLight tracking-widest gold-glow-text">${timeStr}</div>
              <span class="text-xs text-cosmicMuted uppercase tracking-widest mt-2">${this.timer.isRunning ? 'Em Leitura...' : 'Pausado'}</span>
            </div>

            <!-- Preset Buttons -->
            <div class="flex justify-center gap-3">
              <button onclick="app.setTimerPreset(15)" class="px-4 py-2 rounded-xl text-xs font-medium bg-gold/10 text-goldLight border border-gold/30 hover:bg-gold/20">15 min</button>
              <button onclick="app.setTimerPreset(25)" class="px-4 py-2 rounded-xl text-xs font-medium bg-gold/10 text-goldLight border border-gold/30 hover:bg-gold/20">25 min</button>
              <button onclick="app.setTimerPreset(45)" class="px-4 py-2 rounded-xl text-xs font-medium bg-gold/10 text-goldLight border border-gold/30 hover:bg-gold/20">45 min</button>
            </div>

            <!-- Timer Controls -->
            <div class="flex justify-center gap-4">
              <button onclick="app.toggleTimer()" class="px-8 py-3 rounded-xl gold-gradient-bg text-night font-bold text-xs uppercase tracking-wider hover:opacity-90">
                ${this.timer.isRunning ? 'Pausar' : 'Iniciar Sessão'}
              </button>
              <button onclick="app.resetTimer()" class="px-6 py-3 rounded-xl bg-night border border-panelBorder text-cosmicMuted text-xs font-semibold hover:text-cosmicText">
                Resetar
              </button>
            </div>

            <!-- Ambient Sound Toggle -->
            <div class="glass-card rounded-xl p-4 flex items-center justify-between border-panelBorder text-left">
              <div class="flex items-center gap-3">
                <span class="text-2xl text-gold">🎧</span>
                <div>
                  <h5 class="text-xs font-bold text-cosmicText">Sintetizador Sonoro Celestial</h5>
                  <p class="text-[11px] text-cosmicMuted">Onda senoidal relaxante de 108Hz para foco profundo</p>
                </div>
              </div>
              <button onclick="app.toggleAmbientAudio()" id="audioToggleBtn" class="px-4 py-2 rounded-lg text-xs font-bold bg-gold/20 text-goldLight border border-gold/40">
                ${CosmicAudio.isPlaying ? 'Desligar Áudio' : 'Ligar Áudio'}
              </button>
            </div>
          </div>
        `;
      }

      setTimerPreset(minutes) {
        this.resetTimer();
        this.timer.duration = minutes * 60;
        this.timer.remaining = minutes * 60;
        this.render();
      }

      toggleTimer() {
        if (this.timer.isRunning) {
          clearInterval(this.timer.interval);
          this.timer.isRunning = false;
        } else {
          this.timer.isRunning = true;
          this.timer.interval = setInterval(() => {
            if (this.timer.remaining > 0) {
              this.timer.remaining--;
              this.render();
            } else {
              clearInterval(this.timer.interval);
              this.timer.isRunning = false;
              this.render();
            }
          }, 1000);
        }
        this.render();
      }

      resetTimer() {
        clearInterval(this.timer.interval);
        this.timer.isRunning = false;
        this.timer.remaining = this.timer.duration;
        this.render();
      }

      toggleAmbientAudio() {
        const playing = CosmicAudio.toggle();
        const btn = document.getElementById('audioToggleBtn');
        if (btn) btn.textContent = playing ? 'Desligar Áudio' : 'Ligar Áudio';
      }

      // --- VISION BOARD VIEW ---
      renderVisionView() {
        const board = this.data.visionBoard || [];
        return `
          <div class="space-y-6">
            <div class="flex justify-between items-center">
              <div>
                <h3 class="font-cinzel text-xl font-semibold text-goldLight">◇ Vision Board Literário</h3>
                <p class="text-xs text-cosmicMuted">Inspirações estéticas e mentais para amantes da leitura.</p>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              ${board.map(item => `
                <div class="glass-card rounded-2xl overflow-hidden border-panelBorder flex flex-col justify-between min-h-[220px] relative group p-6">
                  <div class="absolute inset-0 z-0 opacity-20 bg-cover bg-center transition-transform duration-700 group-hover:scale-110" style="background-image: url('${this.escapeHTML(item.image)}')"></div>
                  <div class="relative z-10 space-y-4">
                    <p class="font-playfair text-xl italic text-goldLight leading-relaxed">"${this.escapeHTML(item.quote)}"</p>
                  </div>

                </div>

          </div>

        };

          <form onsubmit="app.saveBook(event, '${bookId || ''}')" class="space-y-4 text-xs">
            <div>
              <label class="block text-cosmicMuted mb-1 uppercase tracking-wider">Título</label>
              <input type="text" id="mTitle" value="${this.escapeHTML(book.title)}" required class="w-full bg-night border border-panelBorder rounded-xl p-3 text-cosmicText focus:border-gold">
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-cosmicMuted mb-1 uppercase tracking-wider">Autor</label>
                <input type="text" id="mAuthor" value="${this.escapeHTML(book.author)}" required class="w-full bg-night border border-panelBorder rounded-xl p-3 text-cosmicText focus:border-gold">
              </div>

                <label class="block text-cosmicMuted mb-1 uppercase tracking-wider">Categoria</label>
                <input type="text" id="mCategory" value="${this.escapeHTML(book.category)}" class="w-full bg-night border border-panelBorder rounded-xl p-3 text-cosmicText focus:border-gold">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">

                <label class="block text-cosmicMuted mb-1 uppercase tracking-wider">Status</label>
                <select id="mStatus" class="w-full bg-night border border-panelBorder rounded-xl p-3 text-cosmicText focus:border-gold">
                  <option value="reading" ${book.status==='reading'?'selected':''}>Lendo</option>
                  <option value="want" ${book.status==='want'?'selected':''}>Quero Ler</option>
                  <option value="read" ${book.status==='read'?'selected':''}>Concluído</option>
                </select>
              </div>
              <div>
                <label class="block text-cosmicMuted mb-1 uppercase tracking-wider">Avaliação (1 a 5)</label>
                <input type="number" id="mRating" min="0" max="5" value="${book.rating || 5}" class="w-full bg-night border border-panelBorder rounded-xl p-3 text-cosmicText focus:border-gold">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-cosmicMuted mb-1 uppercase tracking-wider">Total Páginas</label>

              </div>
              <div>
                <label class="block text-cosmicMuted mb-1 uppercase tracking-wider">Página Atual</label>
                <input type="number" id="mCurrentPage" value="${book.currentPage}" required class="w-full bg-night border border-panelBorder rounded-xl p-3 text-cosmicText focus:border-gold">

            </div>
            <div>
              <label class="block text-cosmicMuted mb-1 uppercase tracking-wider">URL do PDF (Opcional)</label>
              <input type="url" id="mPdfUrl" value="${this.escapeHTML(book.pdfUrl || '')}" placeholder="https://exemplo.com/livro.pdf" class="w-full bg-night border border-panelBorder rounded-xl p-3 text-cosmicText focus:border-gold">
            </div>
            <div>
              <label class="block text-cosmicMuted mb-1 uppercase tracking-wider">URL da Capa (Opcional)</label>
              <input type="url" id="mCover" value="${this.escapeHTML(book.cover || '')}" placeholder="https://..." class="w-full bg-night border border-panelBorder rounded-xl p-3 text-cosmicText focus:border-gold">

      saveBook(e, bookId) {
        e.preventDefault();
        const newBook = {
          id: bookId || String(Date.now()),
          title: document.getElementById('mTitle').value,
          author: document.getElementById('mAuthor').value,
          category: document.getElementById('mCategory').value,
          status: document.getElementById('mStatus').value,
          rating: Number(document.getElementById('mRating').value),
          totalPages: Number(document.getElementById('mTotalPages').value),
          currentPage: Number(document.getElementById('mCurrentPage').value),
          pdfUrl: document.getElementById('mPdfUrl').value,
          cover: document.getElementById('mCover').value
        };

        if (bookId) {
          const idx = this.data.books.findIndex(b => b.id === bookId);
          if (idx !== -1) this.data.books[idx] = newBook;
        } else {
          this.data.books.unshift(newBook);
        }

        this.saveStore();
        this.closeModal();
        this.render();
      }

      updatePagesModal(bookId) {
        const book = this.data.books.find(b => b.id === bookId);
        if (!book) return;

        const html = `
          <h3 class="font-cinzel text-lg font-semibold text-goldLight mb-3">Progresso: ${this.escapeHTML(book.title)}</h3>
          <div class="space-y-4 text-xs">
            <div>
              <label class="block text-cosmicMuted mb-1 uppercase tracking-wider">Página Atual (de ${book.totalPages})</label>
              <input type="number" id="mQuickPages" value="${book.currentPage}" max="${book.totalPages}" class="w-full bg-night border border-panelBorder rounded-xl p-3 text-cosmicText focus:border-gold">
            </div>
            <button onclick="app.saveQuickPages('${book.id}')" class="w-full py-3 rounded-xl gold-gradient-bg text-night font-bold uppercase tracking-wider">Atualizar Páginas</button>
          </div>
        `;
        this.openModal(html);
      }

      saveQuickPages(bookId) {
        const val = Number(document.getElementById('mQuickPages').value);
        const book = this.data.books.find(b => b.id === bookId);
        if (book) {
          book.currentPage = val;
          if (book.currentPage >= book.totalPages) {
            book.status = 'read';
          }
          this.saveStore();
          this.closeModal();
          this.render();
        }
      }

      openPdfReader(id) {
        const book = this.data.books.find(b => b.id === id);
        if (!book || !book.pdfUrl) return;

        const html = `
          <div class="space-y-4">
            <div class="flex justify-between items-center border-b border-panelBorder pb-3">
              <div>
                <h3 class="font-cinzel text-base font-semibold text-goldLight">${this.escapeHTML(book.title)}</h3>
                <p class="text-xs text-cosmicMuted">${this.escapeHTML(book.author)}</p>
              </div>
            </div>
            <div class="w-full h-[65vh] rounded-xl overflow-hidden border border-panelBorder bg-night">
              <iframe src="${this.escapeHTML(book.pdfUrl)}" class="w-full h-full border-none"></iframe>
            </div>
          </div>
        `;
        this.openModal(html);
      }
    }

    // Initialize Application on DOM Ready
    let app;
    window.addEventListener('DOMContentLoaded', () => {
      app = new ACSoulApp();
    });
  </script>
</body>
</html>
